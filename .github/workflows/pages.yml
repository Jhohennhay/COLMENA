# Publica el juego en GitHub Pages cada vez que se sube algo a main.
# Activa Pages en Settings → Pages → Source: GitHub Actions. El enlace queda en https://<usuario>.github.io/colmena/
name: Publicar en GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run build:min
      # las pruebas de diseño rechazadas y la demo en papel se construyen para las pruebas, pero no se publican
      - run: rm -f dist/prueba.html dist/prueba-mv.html dist/colmena-demo.html
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
