# La batería completa de pruebas corre aquí después de cada subida a main, sin hacer esperar a nadie.
# No bloquea la publicación (pages.yml va por su cuenta): si algo falla, se arregla en la siguiente subida.
name: Batería de pruebas
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pruebas
  cancel-in-progress: true
jobs:
  pruebas:
    # fijado a 24.04: desde que ubuntu-latest pasó a Ubuntu 26 (19 oct 2026) falla la instalación del navegador de Playwright
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      # la descarga del Chromium de Playwright se cuelga en GitHub desde finales de octubre de 2026; se usa el Google Chrome
      # que ya trae la máquina (playwright.config.js lo elige con COLMENA_CHROME=1)
      - run: npm test
        env: { COLMENA_CHROME: '1' }
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: resultados-de-pruebas
          path: test-results
          retention-days: 7
